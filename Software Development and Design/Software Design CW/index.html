<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="validationForm">
    <form action="thanks.html">
      <div class="container">
        <h1>Submit Your Form</h1>
        
          <!-- Title -->
          <div class="form-group">
            <label for="title">Title:</label>
            <select id="title" name="title">
              <option value="">Select Title</option>
              <option value="MR">MR</option>
              <option value="MRS">MRS</option>
              <option value="MISS">MISS</option>
              <option value="MS">MS</option>
              <option value="DR">DR</option>
            </select>
          </div>

          <!-- First Name -->
          <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" />
          </div>

          <!-- Last Name -->
          <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" />
          </div>

          <!-- Date of Birth-->
          <div class="form-group">
            <label for="dob">Date of Birth:</label>
            <div class="dob-container">
              <input type="text" id="day-dob" name="dob" placeholder="DD" inputmode="numeric" maxlength="2" />
              <input type="text" id="mon-dob" name="dob" placeholder="MM" inputmode="numeric" maxlength="2"/>
              <input type="text" id="yr-dob" name="dob" placeholder="YYYY" inputmode="numeric" maxlength="4"/>
            </div>
          </div>

          <!-- Age -->
           <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age">
           </div>

          <!-- Country -->
          <div class="form-group">
            <label for="country">Country:</label>
            <select id="country" name="country">
              <option value="">Select Country</option>
            </select>
          </div>

          <!-- Address -->
          <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" />
          </div>

          <div>
            <button type="submit">Submit</button>
          </div>
        
      </div>
      <script src="script.js"></script>
    </body>
  </form>
</html>
